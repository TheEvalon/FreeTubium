name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          # Oldest supported Ubuntu image, so the .deb/.AppImage link against an
          # older glibc and stay installable on current LTS releases.
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch yt-dlp / ffmpeg sidecars
        run: npm run fetch-binaries

      # scripts/fetch-binaries.mjs names sidecars after the *host* triple. The
      # Intel macOS build is cross-compiled from the arm64 runner, so reuse the
      # downloaded binaries under the Intel name (yt-dlp_macos is universal and
      # the ffmpeg build is x86_64 already).
      - name: Stage sidecars for cross-compiled macOS target
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          cd src-tauri/binaries
          for name in yt-dlp ffmpeg; do
            src="${name}-aarch64-apple-darwin"
            dst="${name}-x86_64-apple-darwin"
            if [ ! -f "$dst" ] && [ -f "$src" ]; then
              cp "$src" "$dst"
              chmod +x "$dst"
            fi
          done

      - name: Verify sidecars exist for ${{ matrix.target }}
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          for name in yt-dlp ffmpeg; do
            file="src-tauri/binaries/${name}-${{ matrix.target }}${ext}"
            if [ ! -f "$file" ]; then
              echo "::error::Missing sidecar $file"
              exit 1
            fi
            echo "found $file"
          done

      - name: Build app and upload to release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy chokes on stripping the bundled static ffmpeg.
          NO_STRIP: ${{ startsWith(matrix.os, 'ubuntu') && 'true' || '' }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: FreeTubium ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File |
            | --- | --- |
            | Windows | `.exe` (NSIS installer) or `.msi` |
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Linux | `.AppImage` or `.deb` |

            The builds are not code-signed, so Windows SmartScreen and macOS
            Gatekeeper will warn on first launch.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload bundles as workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: freetubium-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
