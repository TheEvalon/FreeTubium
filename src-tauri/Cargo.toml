[package]
name = "freetubium"
version = "0.1.0"
description = "FreeTubium — a modern cross-platform video downloader powered by yt-dlp"
authors = ["TheEvalon"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freetubium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Serves the embed's host page and the prepared playback files from 127.0.0.1:
# the embed needs a real http origin, and WebKitGTK will not play media from a
# custom scheme. Two routes and byte ranges, so a full async framework would be
# overkill.
tiny_http = "0.12"
